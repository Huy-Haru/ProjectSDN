/* Progress and proof workspace */
.progress-log-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }.progress-log-card { background:rgba(184,243,106,.06); border:1px solid var(--border-color); border-radius:14px; padding:16px; }.progress-log-date { color:var(--accent-green); font-size:.72rem; font-weight:800; }.progress-log-values { display:flex; gap:18px; margin:18px 0 14px; }.progress-log-values span { display:grid; gap:3px; }.progress-log-values b { font-size:1.35rem; color:var(--text-main); }.progress-log-values small,.progress-log-card p,.progress-log-card>small { color:var(--text-muted); font-size:.73rem; }.progress-log-card p { min-height:34px; margin:0 0 12px; line-height:1.45; }.plan-grid { display:grid; gap:16px; }.plan-card { border:1px solid var(--border-color); border-radius:16px; padding:20px; background:rgba(15,23,42,.25); }.plan-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }.plan-card h3 { color:var(--text-main); margin:7px 0 0; font-size:1.15rem; }.plan-date { color:var(--text-muted); font-size:.73rem; white-space:nowrap; }.exercise-list { display:grid; gap:7px; margin:18px 0; }.exercise-row { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; background:rgba(148,163,184,.06); }.exercise-day { min-width:56px; color:var(--accent-green); font-size:.7rem; font-weight:800; }.exercise-row div { display:grid; gap:3px; }.exercise-row strong { color:var(--text-main); font-size:.8rem; }.exercise-row small { color:var(--text-muted); font-size:.72rem; }.plan-card-actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }.plan-card-actions button { display:inline-flex; align-items:center; gap:7px; }.plan-card-actions>span { display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-size:.74rem; }.plan-card-actions>span svg { color:var(--accent-green); }.proof-form { margin-top:18px; border-top:1px solid var(--border-color); padding-top:18px; }.proof-form-heading { display:flex; justify-content:space-between; color:var(--text-main); }.proof-form-heading h3 { font-size:1rem; margin:0 0 4px; }.proof-form-heading p { color:var(--text-muted); font-size:.74rem; margin:0; }.proof-form-heading>svg { color:var(--accent-green); font-size:1.3rem; }.proof-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }.proof-form label { display:grid; gap:6px; color:var(--text-muted); font-size:.74rem; }.proof-form label input,.proof-form label select,.proof-form label textarea { border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main); border-radius:9px; padding:9px 11px; }.proof-url-field { grid-column:1/-1; }.submission-list { display:grid; gap:8px; }.submission-row { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border-color); border-radius:11px; color:var(--text-main); text-decoration:none; }.submission-row:hover { border-color:var(--accent-green); transform:translateX(2px); }.submission-row>span:nth-child(2) { display:grid; gap:3px; flex:1; }.submission-row strong { font-size:.8rem; }.submission-row small { color:var(--text-muted); font-size:.72rem; }.submission-row>svg { color:var(--text-muted); font-size:.75rem; }.submission-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:rgba(184,243,106,.1); color:var(--accent-green); }
+@media (max-width:680px) { .plan-card-top,.proof-form-grid { grid-template-columns:1fr; display:grid; }.plan-date { white-space:normal; }.proof-url-field { grid-column:auto; } }
