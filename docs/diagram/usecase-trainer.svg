="Arial, sans-serif" font-size="25" fill="#172b43" font-weight="700"><tspan x="51" dy="0">USE CASE · PT / HUẤN LUYỆN VIÊN</tspan></text><circle cx="135" cy="718" r="14" fill="white" stroke="#66788a"/><path d="M135,732v48 M70,755h130 M135,780l-27,32 M135,780l27,32" fill="none" stroke="#66788a" stroke-width="2"/><text x="135" y="838" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b43"><tspan x="135" dy="0">PT / Huấn luyện viên</tspan></text><ellipse cx="635" cy="226.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="232.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-02 · Đăng nhập</tspan></text><ellipse cx="635" cy="356.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="362.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-11 · Xem / cập nhật profile PT</tspan></text><ellipse cx="635" cy="486.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="492.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">FR-09 · Xem lịch của mình</tspan></text><ellipse cx="635" cy="616.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="622.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-06 · Xác nhận kết quả buổi tập</tspan></text><ellipse cx="635" cy="746.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="752.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem hội viên liên quan</tspan></text><ellipse cx="635" cy="876.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="882.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-07 · Tạo / cập nhật giáo án</tspan></text><ellipse cx="635" cy="1006.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="1012.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-07 · Cập nhật tiến độ hội viên</tspan></text><ellipse cx="635" cy="1136.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="1142.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem đánh giá của hội viên</tspan></text><ellipse cx="635" cy="1266.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="1272.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">FR-15 · Xem dashboard PT</tspan></text><ellipse cx="635" cy="1396.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="1402.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-02 · Đăng xuất</tspan></text><ellipse cx="1370" cy="616.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="610.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra quyền / trạng thái</tspan><tspan x="1370" dy="22.950000000000003">Lưu completed hoặc no_show</tspan></text><ellipse cx="1370" cy="876.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="870.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra hội viên liên quan</tspan><tspan x="1370" dy="22.950000000000003">Validate giáo án và khoảng ngày</tspan></text><ellipse cx="1370" cy="1006.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="1000.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra quyền cập nhật</tspan><tspan x="1370" dy="22.950000000000003">Validate chỉ số cơ thể</tspan></text><text x="396" y="1548" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#172b43"><tspan x="396" dy="0">Association: đường liền không mũi tên. «include»: use case chính → xử lý bắt buộc.</tspan><tspan x="396" dy="20.25">«extend»: hành vi tùy chọn → use case được mở rộng; điều kiện ghi trong [ ].</tspan><tspan x="396" dy="20.25">Các thao tác bảo vệ có tiền điều kiện đăng nhập đúng vai trò; không include “Đăng nhập” vào mọi thao tác.</tspan></text><rect x="954" y="586" width="92" height="28" rx="3" fill="white"/><text x="1000" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="846" width="92" height="28" rx="3" fill="white"/><text x="1000" y="861" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="976" width="92" height="28" rx="3" fill="white"/><text x="1000" y="991" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text></svg>