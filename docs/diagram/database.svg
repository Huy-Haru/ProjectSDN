-10 L-17,0 L0,10 M-17,0 H0"/><circle cx="-27" cy="0" r="6" fill="white"/></g><g transform="translate(476,890) rotate(-90)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-9,-9 V9"/><circle cx="-23" cy="0" r="6" fill="white"/></g><path d="M1350,1284 L1500,1284 L1500,1622 L1610,1622" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1610,1622) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-9,-9 V9"/><circle cx="-23" cy="0" r="6" fill="white"/></g><g transform="translate(1350,1284) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-10,-9 V9 M-17,-9 V9"/></g><path d="M1279.5,170 L1279.5,135 L2145,135 L2145,1706 L2080,1706" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(2080,1706) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M0,-10 L-17,0 L0,10 M-17,0 H0"/><circle cx="-27" cy="0" r="6" fill="white"/></g><g transform="translate(1279.5,170) rotate(90)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-10,-9 V9 M-17,-9 V9"/></g><path d="M570,834 L650,834 L650,1460 L1845,1460 L1845,1510" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1845,1510) rotate(90)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M0,-10 L-17,0 L0,10 M-17,0 H0"/><circle cx="-27" cy="0" r="6" fill="white"/></g><g transform="translate(570,834) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-10,-9 V9 M-17,-9 V9"/></g><text x="51" y="60" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#172b43" font-weight="700"><tspan x="51" dy="0">DATABASE DIAGRAM · MONGODB</tspan></text><text x="51" y="111" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="51" dy="0">Một entity xuất hiện một lần · Crow’s foot: || = 1; O| = 0..1; O&lt; = 0..N · Ref MongoDB không phải khóa ngoại</tspan></text><rect x="880" y="170" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="896" y="202" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="896" dy="0">User / users</tspan><tspan x="896" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="896" dy="22.950000000000003">fullName, email [unique], password</tspan><tspan x="896" dy="22.950000000000003">phone, gender, dateOfBirth, avatar</tspan><tspan x="896" dy="22.950000000000003">role: member | trainer (PT) | admin</tspan><tspan x="896" dy="22.950000000000003">isActive: Boolean</tspan></text><rect x="100" y="610" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="116" y="642" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="116" dy="0">TrainerProfile / trainerprofiles</tspan><tspan x="116" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="116" dy="22.950000000000003">user: ObjectId [ref User, unique]</tspan><tspan x="116" dy="22.950000000000003">specialties[], certificates[], bio</tspan><tspan x="116" dy="22.950000000000003">experienceYears, pricePerSession</tspan><tspan x="116" dy="22.950000000000003">ratingAverage, ratingCount, isActive</tspan></text><rect x="1610" y="170" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="1626" y="202" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1626" dy="0">MembershipPackage / membershippackages</tspan><tspan x="1626" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="1626" dy="22.950000000000003">name, description, durationDays</tspan><tspan x="1626" dy="22.950000000000003">price, sessionLimit (null = unlimited)</tspan><tspan x="1626" dy="22.950000000000003">includesPT, isActive</tspan></text><rect x="1610" y="770" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="1626" y="802" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1626" dy="0">Subscription / subscriptions</tspan><tspan x="1626" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="1626" dy="22.950000000000003">member: ref User; package: ref Package</tspan><tspan x="1626" dy="22.950000000000003">startDate, endDate, amount, paidAt</tspan><tspan x="1626" dy="22.950000000000003">status: pending / active / expired / cancelled</tspan><tspan x="1626" dy="22.950000000000003">paymentStatus: unpaid / paid</tspan><tspan x="1626" dy="22.950000000000003">includesPT, sessionLimit; reservedSessions</tspan></text><rect x="880" y="1060" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="896" y="1092" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="896" dy="0">Booking / bookings</tspan><tspan x="896" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="896" dy="22.950000000000003">member: ref User; trainer: ref TrainerProfile</tspan><tspan x="896" dy="22.950000000000003">subscription: ref Subscription</tspan><tspan x="896" dy="22.950000000000003">date, startTime, endTime, note</tspan><tspan x="896" dy="22.950000000000003">quotaReserved: Boolean</tspan><tspan x="896" dy="22.950000000000003">status: booked / completed / cancelled / no_show</tspan></text><rect x="100" y="1510" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="116" y="1542" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="116" dy="0">WorkoutPlan / workoutplans</tspan><tspan x="116" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="116" dy="22.950000000000003">member: ref User; trainer: ref TrainerProfile</tspan><tspan x="116" dy="22.950000000000003">title, goal, startDate, endDate, status</tspan><tspan x="116" dy="22.950000000000003">items[]: embedded exercises / sets / reps</tspan></text><rect x="880" y="1890" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="896" y="1922" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="896" dy="0">ProgressLog / progresslogs</tspan><tspan x="896" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="896" dy="22.950000000000003">member: ref User; trainer?: ref TrainerProfile</tspan><tspan x="896" dy="22.950000000000003">date, weight, bodyFat, height</tspan><tspan x="896" dy="22.950000000000003">attendedSessions, note</tspan></text><rect x="1610" y="1510" width="470" height="280" rx="0" fill="#fff5db" stroke="#ac893f"/><text x="1626" y="1542" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1626" dy="0">Review / reviews</tspan><tspan x="1626" dy="22.950000000000003">_id: ObjectId [PK]</tspan><tspan x="1626" dy="22.950000000000003">member: ref User; trainer: ref TrainerProfile</tspan><tspan x="1626" dy="22.950000000000003">booking: ref Booking [unique]</tspan><tspan x="1626" dy="22.950000000000003">rating: integer 1–5; comment</tspan></text><text x="86" y="2256" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="86" dy="0">User là profile chung cho ba role; TrainerProfile chỉ mở rộng cho PT. ProgressLog.trainer tùy chọn.</tspan><tspan x="86" dy="21.6">Booking → Review là 1 → 0..1; User → TrainerProfile là 1 → 0..1. Các quan hệ còn lại có thể chưa có bản ghi con.</tspan><tspan x="86" dy="21.6">Tất cả collection có createdAt / updatedAt / __v. Index và validation chi tiết: docs/04-database-design.md và docs/06-mongodb-optimization.md.</tspan></text><rect x="456" y="485" width="108" height="28" rx="3" fill="white"/><text x="510" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="510" dy="0">Có hồ sơ PT</tspan></text><rect x="1411" y="635" width="108" height="28" rx="3" fill="white"/><text x="1465" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1465" dy="0">Đăng ký gói</tspan></text><rect x="1812" y="600" width="116" height="28" rx="3" fill="white"/><text x="1870" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1870" dy="0">Được đăng ký</tspan></text><rect x="1103" y="685" width="84" height="28" rx="3" fill="white"/><text x="1145" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1145" dy="0">Đặt lịch</tspan></text><rect x="675" y="970" width="100" height="28" rx="3" fill="white"/><text x="725" y="985" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="725" dy="0">Huấn luyện</tspan></text><rect x="1406" y="1055" width="108" height="28" rx="3" fill="white"/><text x="1460" y="1070" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1460" dy="0">Sử dụng gói</tspan></text><rect x="72" y="1195" width="116" height="28" rx="3" fill="white"/><text x="130" y="1210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="130" dy="0">Nhận giáo án</tspan></text><rect x="236" y="1155" width="108" height="28" rx="3" fill="white"/><text x="290" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="290" dy="0">Tạo giáo án</tspan></text><rect x="728" y="1735" width="164" height="28" rx="3" fill="white"/><text x="810" y="1750" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="810" dy="0">Có nhật ký tiến độ</tspan></text><rect x="557" y="1775" width="196" height="28" rx="3" fill="white"/><text x="655" y="1790" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="655" dy="0">Ghi nhận (PT tùy chọn)</tspan></text><rect x="1431" y="1395" width="108" height="28" rx="3" fill="white"/><text x="1485" y="1410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1485" dy="0">Có đánh giá</tspan></text><rect x="1998" y="1245" width="124" height="28" rx="3" fill="white"/><text x="2060" y="1260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="2060" dy="0">Viết đánh giá</tspan></text><rect x="1578" y="1422" width="124" height="28" rx="3" fill="white"/><text x="1640" y="1437" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1640" dy="0">Được đánh giá</tspan></text></svg>