<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="850" viewBox="0 0 1760 850"><rect width="100%" height="100%" fill="white"/><rect x="340" y="105" width="1370" height="710" fill="white" stroke="#5479aa"/><text x="1025" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172b43" font-weight="700"><tspan x="1025" dy="0">FitManager — ranh giới hệ thống</tspan></text><path d="M200,365 L430,226.5" fill="none" stroke="#506b86" stroke-width="1.6"/><path d="M200,365 L430,356.5" fill="none" stroke="#506b86" stroke-width="1.6"/><path d="M200,365 L430,486.5" fill="none" stroke="#506b86" stroke-width="1.6"/><path d="M200,365 L430,616.5" fill="none" stroke="#506b86" stroke-width="1.6"/><path d="M840,486.5 L1160,486.5" fill="none" stroke="#506b86" stroke-width="1.6" stroke-dasharray="7 5"/><g transform="translate(1160,486.5) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6" fill="none"/></g><path d="M840,616.5 L1160,616.5" fill="none" stroke="#506b86" stroke-width="1.6" stroke-dasharray="7 5"/><g transform="translate(1160,616.5) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6" fill="none"/></g><text x="51" y="60" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#172b43" font-weight="700"><tspan x="51" dy="0">USE CASE · KHÁCH</tspan></text><circle cx="135" cy="328" r="14" fill="white" stroke="#66788a"/><path d="M135,342v48 M70,365h130 M135,390l-27,32 M135,390l27,32" fill="none" stroke="#66788a" stroke-width="2"/><text x="135" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172b43"><tspan x="135" dy="0">Khách</tspan></text><ellipse cx="635" cy="226.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="232.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem danh sách / chi tiết gói tập</tspan></text><ellipse cx="635" cy="356.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="362.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Tìm và xem hồ sơ PT</tspan></text><ellipse cx="635" cy="486.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="492.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-01 · Đăng ký tài khoản Member</tspan></text><ellipse cx="635" cy="616.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="622.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-02 · Đăng nhập</tspan></text><ellipse cx="1370" cy="486.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="480.97499999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra email / mật khẩu</tspan><tspan x="1370" dy="22.950000000000003">Gán role member</tspan></text><ellipse cx="1370" cy="616.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="610.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra tài khoản hoạt động</tspan><tspan x="1370" dy="22.950000000000003">và mật khẩu</tspan></text><text x="396" y="768" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#172b43"><tspan x="396" dy="0">Association: đường liền không mũi tên. «include»: use case chính → xử lý bắt buộc.</tspan><tspan x="396" dy="20.25">«extend»: hành vi tùy chọn → use case được mở rộng; điều kiện ghi trong [ ].</tspan><tspan x="396" dy="20.25">Các thao tác bảo vệ có tiền điều kiện đăng nhập đúng vai trò; không include “Đăng nhập” vào mọi thao tác.</tspan></text><rect x="954" y="456" width="92" height="28" rx="3" fill="white"/><text x="1000" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="586" width="92" height="28" rx="3" fill="white"/><text x="1000" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text></svg>