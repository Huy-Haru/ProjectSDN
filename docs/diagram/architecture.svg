" font-size="18" fill="#172b43"><tspan x="1610" dy="0">MongoDB</tspan><tspan x="1610" dy="24.3">fitmanager collections</tspan></text><text x="86" y="821" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="86" dy="0">JWT xác thực lại User hiện hành trên mỗi request. Role và chủ sở hữu được kiểm tra ở backend; UI ẩn menu chỉ là UX. MongoDB standalone chưa bảo đảm transaction nhiều document.</tspan></text><rect x="350" y="415" width="100" height="28" rx="3" fill="white"/><text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="400" dy="0">fetch JSON</tspan></text><rect x="674" y="415" width="92" height="28" rx="3" fill="white"/><text x="720" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="720" dy="0">HTTP /api</tspan></text><rect x="954" y="245" width="132" height="28" rx="3" fill="white"/><text x="1020" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1020" dy="0">route dispatch</tspan></text><rect x="1168" y="405" width="164" height="28" rx="3" fill="white"/><text x="1250" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1250" dy="0">authorized request</tspan></text><rect x="1369" y="555" width="132" height="28" rx="3" fill="white"/><text x="1435" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1435" dy="0">query / update</tspan></text><rect x="1540" y="585" width="140" height="28" rx="3" fill="white"/><text x="1610" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1610" dy="0">Mongoose driver</tspan></text></svg>