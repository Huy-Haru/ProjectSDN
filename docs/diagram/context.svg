y="791.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b43" font-weight="700"><tspan x="1445" dy="0">Admin / Quản trị viên</tspan></text><text x="116" y="966" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="116" dy="0">Phạm vi: website + API + lưu trữ nội bộ. MongoDB không phải tác nhân ngoài hệ thống.</tspan><tspan x="116" dy="21.6">Guest chưa đăng nhập; ba role tài khoản: member, trainer (PT), admin.</tspan></text><text x="420" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="420" dy="0">Tiêu chí tra cứu; thông tin</tspan><tspan x="420" dy="20.25">đăng ký / đăng nhập</tspan></text><text x="415" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="415" dy="0">Thông tin gói tập;</tspan><tspan x="415" dy="20.25">kết quả đăng ký / xác thực</tspan></text><text x="425" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="425" dy="0">Yêu cầu gói / đặt, hủy lịch;</tspan><tspan x="425" dy="20.25">profile và đánh giá</tspan></text><text x="460" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="460" dy="0">Trạng thái gói / lịch;</tspan><tspan x="460" dy="20.25">giáo án, tiến độ và kết quả xử lý</tspan></text><text x="1210" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1210" dy="0">Profile PT; giáo án / tiến độ;</tspan><tspan x="1210" dy="20.25">kết quả buổi tập</tspan></text><text x="1280" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1280" dy="0">Lịch và hội viên;</tspan><tspan x="1280" dy="20.25">đánh giá / thống kê</tspan></text><text x="1270" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1270" dy="0">Dữ liệu quản lý;</tspan><tspan x="127