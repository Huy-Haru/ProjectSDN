<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1020" viewBox="0 0 1640 1020"><rect width="100%" height="100%" fill="white"/><path d="M300,218.5 L540,218.5 L540,420 L694.115427318801,420" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(694.115427318801,420) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M733.0138469732422,373.2 L600,373.2 L600,273.5 L300,273.5" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(300,273.5) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M300,768.5 L540,768.5 L540,582 L685.0272749815897,582" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(685.0272749815897,582) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M721.4542882862287,636 L600,636 L600,823.5 L300,823.5" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(300,823.5) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M1330,218.5 L1170,218.5 L1170,420 L1005.884572681199,420" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1005.884572681199,420) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M966.9861530267578,373.2 L1110,373.2 L1110,273.5 L1330,273.5" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1330,273.5) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M1330,768.5 L1170,768.5 L1170,582 L1014.9727250184103,582" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1014.9727250184103,582) rotate(180)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><path d="M978.5457117137713,636 L1110,636 L1110,823.5 L1330,823.5" fill="none" stroke="#506b86" stroke-width="1.6"/><g transform="translate(1330,823.5) rotate(0)" stroke="#506b86" stroke-width="1.6" fill="none"><path d="M-13,-6 L0,0 L-13,6 Z" fill="#506b86"/></g><text x="51" y="60" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#172b43" font-weight="700"><tspan x="51" dy="0">SƠ ĐỒ NGỮ CẢNH · FITMANAGER</tspan></text><text x="51" y="111" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="51" dy="0">DFD mức 0 · Website, REST API và MongoDB nội bộ · Admin xác nhận thanh toán thủ công</tspan></text><ellipse cx="850" cy="510" rx="180" ry="180" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="850" y="471.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172b43" font-weight="700"><tspan x="850" dy="0">0</tspan><tspan x="850" dy="31.05">FITMANAGER</tspan><tspan x="850" dy="31.05">Quản lý phòng tập</tspan><tspan x="850" dy="31.05">và huấn luyện viên</tspan></text><rect x="70" y="180" width="230" height="110" rx="0" fill="#f4f5f6" stroke="#505963"/><text x="185" y="241.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b43" font-weight="700"><tspan x="185" dy="0">Khách</tspan></text><rect x="70" y="730" width="230" height="110" rx="0" fill="#f4f5f6" stroke="#505963"/><text x="185" y="791.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b43" font-weight="700"><tspan x="185" dy="0">Member / Hội viên</tspan></text><rect x="1330" y="180" width="230" height="110" rx="0" fill="#f4f5f6" stroke="#505963"/><text x="1445" y="241.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b43" font-weight="700"><tspan x="1445" dy="0">PT / Huấn luyện viên</tspan></text><rect x="1330" y="730" width="230" height="110" rx="0" fill="#f4f5f6" stroke="#505963"/><text x="1445" y="791.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#172b43" font-weight="700"><tspan x="1445" dy="0">Admin / Quản trị viên</tspan></text><text x="116" y="966" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#172b43"><tspan x="116" dy="0">Phạm vi: React/Vite → REST API Express/Mongoose → MongoDB. Không có payment gateway.</tspan><tspan x="116" dy="21.6">QR chỉ là mã minh họa; phiên bản hiện tại không có API quét/xác thực check-in.</tspan></text><text x="420" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="420" dy="0">Yêu cầu xem gói;</tspan><tspan x="420" dy="20.25">dữ liệu đăng ký / đăng nhập</tspan></text><text x="415" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="415" dy="0">Danh mục gói;</tspan><tspan x="415" dy="20.25">kết quả xác thực tài khoản</tspan></text><text x="425" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="425" dy="0">Đăng ký gói; đặt / hủy lịch;</tspan><tspan x="425" dy="20.25">hồ sơ, đánh giá, bằng chứng tập</tspan></text><text x="460" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="460" dy="0">Trạng thái gói / lịch;</tspan><tspan x="460" dy="20.25">giáo án, tiến độ và kết quả xử lý</tspan></text><text x="1210" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1210" dy="0">Hồ sơ PT; lịch dạy;</tspan><tspan x="1210" dy="20.25">giáo án, tiến độ và kết quả buổi</tspan></text><text x="1280" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1280" dy="0">Danh sách học viên liên quan;</tspan><tspan x="1280" dy="20.25">lịch, bài nộp và đánh giá</tspan></text><text x="1270" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1270" dy="0">Quản lý tài khoản / gói / lịch;</tspan><tspan x="1270" dy="20.25">xác nhận thanh toán thủ công</tspan></text><text x="1210" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1210" dy="0">Danh sách quản trị; doanh thu;</tspan><tspan x="1210" dy="20.25">trạng thái vận hành</tspan></text></svg>