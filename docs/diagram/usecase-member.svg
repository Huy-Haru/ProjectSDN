"635" y="1532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">FR-15 · Xem dashboard cá nhân</tspan></text><ellipse cx="635" cy="1656.5" rx="205" ry="41.5" fill="#eaf2fc" stroke="#5479aa" stroke-width="1.6"/><text x="635" y="1662.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-02 · Đăng xuất</tspan></text><ellipse cx="1370" cy="616.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="610.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra gói hoạt động</tspan><tspan x="1370" dy="22.950000000000003">Chốt giá / thời hạn</tspan></text><ellipse cx="1370" cy="836.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="830.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra gói paid / active</tspan><tspan x="1370" dy="22.950000000000003">Ngày hiệu lực và hạn mức buổi</tspan></text><ellipse cx="1370" cy="941.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="935.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra thời gian / xung đột</tspan><tspan x="1370" dy="22.950000000000003">PT và hội viên</tspan></text><ellipse cx="1370" cy="1081.5" rx="210" ry="41.5" fill="#fff5db" stroke="#ac893f" stroke-width="1.6"/><text x="1370" y="1087.45" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Hủy lịch của mình</tspan></text><ellipse cx="1370" cy="1396.5" rx="210" ry="41.5" fill="#eaf7ef" stroke="#568a69" stroke-width="1.6"/><text x="1370" y="1390.9750000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra booking completed</tspan><tspan x="1370" dy="22.950000000000003">Đúng chủ và chưa đánh giá</tspan></text><text x="396" y="1808" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#172b43"><tspan x="396" dy="0">Association: đường liền không mũi tên. «include»: use case chính → xử lý bắt buộc.</tspan><tspan x="396" dy="20.25">«extend»: hành vi tùy chọn → use case được mở rộng; điều kiện ghi trong [ ].</tspan><tspan x="396" dy="20.25">Các thao tác bảo vệ có tiền điều kiện đăng nhập đúng vai trò; không include “Đăng nhập” vào mọi thao tác.</tspan></text><rect x="954" y="586" width="92" height="28" rx="3" fill="white"/><text x="1000" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="826" width="92" height="28" rx="3" fill="white"/><text x="1000" y="841" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="878.5" width="92" height="28" rx="3" fill="white"/><text x="1000" y="893.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="914" y="1050" width="172" height="48" rx="3" fill="white"/><text x="1000" y="1065" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«extend»</tspan><tspan x="1000" dy="20.25">[trước giờ bắt đầu]</tspan></text><rect x="954" y="1366" width="92" height="28" rx="3" fill="white"/><text x="1000" y="1381" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text></svg>