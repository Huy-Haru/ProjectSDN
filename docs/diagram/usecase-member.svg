xt x="635" y="622.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Đặt lịch PT</tspan></text><ellipse cx="635" cy="746.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="752.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem / hủy lịch của mình</tspan></text><ellipse cx="635" cy="876.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="882.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem QR check-in mô phỏng</tspan></text><ellipse cx="635" cy="1006.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="1012.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem giáo án và tiến độ</tspan></text><ellipse cx="635" cy="1136.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="1142.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Gửi link bằng chứng tập</tspan></text><ellipse cx="635" cy="1266.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="1272.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Đánh giá buổi đã hoàn thành</tspan></text><ellipse cx="635" cy="1396.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="1402.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">Xem tổng quan hội viên</tspan></text><ellipse cx="635" cy="1526.5" rx="205" ry="41.5" fill="#ffffff" stroke="#3f4852" stroke-width="1.6"/><text x="635" y="1532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172b43"><tspan x="635" dy="0">UC-02 · Đăng xuất</tspan></text><ellipse cx="1370" cy="486.5" rx="210" ry="41.5" fill="#f6f7f8" stroke="#69737d" stroke-width="1.6"/><text x="1370" y="480.97499999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Server chốt giá và quyền lợi</tspan><tspan x="1370" dy="22.950000000000003">Trạng thái pending / unpaid</tspan></text><ellipse cx="1370" cy="836.5" rx="210" ry="41.5" fill="#f6f7f8" stroke="#69737d" stroke-width="1.6"/><text x="1370" y="830.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra gói, quota và</tspan><tspan x="1370" dy="22.950000000000003">xung đột slot tại server</tspan></text><ellipse cx="1370" cy="1211.5" rx="210" ry="41.5" fill="#f1f3f5" stroke="#3f4852" stroke-width="1.6"/><text x="1370" y="1217.45" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Hủy lịch của mình</tspan></text><ellipse cx="1370" cy="1266.5" rx="210" ry="41.5" fill="#f6f7f8" stroke="#69737d" stroke-width="1.6"/><text x="1370" y="1260.9750000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Kiểm tra booking completed</tspan><tspan x="1370" dy="22.950000000000003">Đúng chủ, chưa được đánh giá</tspan></text><ellipse cx="1370" cy="876.5" rx="210" ry="41.5" fill="#f6f7f8" stroke="#69737d" stroke-width="1.6"/><text x="1370" y="870.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172b43"><tspan x="1370" dy="0">Chỉ hiển thị payload mô phỏng</tspan><tspan x="1370" dy="22.950000000000003">Không xác thực lượt vào</tspan></text><text x="396" y="1678" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#172b43"><tspan x="396" dy="0">Association: đường liền không mũi tên. «include»: use case chính → xử lý bắt buộc.</tspan><tspan x="396" dy="20.25">«extend»: hành vi tùy chọn → use case được mở rộng; điều kiện ghi trong [ ].</tspan><tspan x="396" dy="20.25">Các thao tác bảo vệ có tiền điều kiện đăng nhập đúng vai trò; không include “Đăng nhập” vào mọi thao tác.</tspan></text><rect x="954" y="456" width="92" height="28" rx="3" fill="white"/><text x="1000" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="696" width="92" height="28" rx="3" fill="white"/><text x="1000" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="914" y="1180" width="172" height="48" rx="3" fill="white"/><text x="1000" y="1195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«extend»</tspan><tspan x="1000" dy="20.25">[trước giờ bắt đầu]</tspan></text><rect x="954" y="1236" width="92" height="28" rx="3" fill="white"/><text x="1000" y="1251" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text><rect x="954" y="846" width="92" height="28" rx="3" fill="white"/><text x="1000" y="861" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#284461"><tspan x="1000" dy="0">«include»</tspan></text></svg>